[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[program:openvpn]
command=openvpn --config /app/data/server/server.conf --cd /app/data/server
directory=/app/data/server
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/var/log/openvpn.stdout.log
stderr_logfile=/var/log/openvpn.stderr.log

[program:web]
command=python app.py
directory=/app
autostart=true
autorestart=true
startsecs=3
priority=20
stdout_logfile=/var/log/web.stdout.log
stderr_logfile=/var/log/web.stderr.log
