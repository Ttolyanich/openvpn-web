version: '3.8'

services:
  openvpn-web:
    image: ghcr.io/ttolyanich/openvpn-web:latest
    build: .
    container_name: openvpn-web
    restart: unless-stopped
    privileged: true
    pid: host
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BIND_PORT:-5000}:${BIND_PORT:-5000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - /etc/openvpn:/etc/openvpn
      - /root/openvpn:/root/openvpn
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /run/openvpn-server:/run/openvpn-server:ro
    env_file:
      - .env
    command: gunicorn --workers 2 --bind 0.0.0.0:${BIND_PORT:-5000} app:app
