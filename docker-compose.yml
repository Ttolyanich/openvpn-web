version: '3.8'

services:
  openvpn-web:
    image: ghcr.io/ttolyanich/openvpn-web:latest
    build: .
    container_name: openvpn-web
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - BIND_PORT=${BIND_PORT:-5000}
      - OPENVPN_PORT=${OPENVPN_PORT:-1194}
      - OPENVPN_PROTO=${OPENVPN_PROTO:-udp}
      - PUBLIC_IP=${PUBLIC_IP:-}
